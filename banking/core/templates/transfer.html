<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transfer Money</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container">
    <h2>Transfer Money</h2>
    <div class="mb-3">
        <input type="text" id="jwtToken" class="form-control" placeholder="Enter JWT Access Token">
    </div>
    <div class="mb-3">
        <input type="text" id="fromAccount" class="form-control" placeholder="From Account">
    </div>
    <div class="mb-3">
        <input type="text" id="toAccount" class="form-control" placeholder="To Account">
    </div>
    <div class="mb-3">
        <input type="number" id="amount" class="form-control" placeholder="Amount">
    </div>
    <button class="btn btn-primary" onclick="makeTransfer()">Transfer</button>

    <div id="alert" class="mt-3"></div>
</div>

<script>
async function makeTransfer() {
    const token = document.getElementById("jwtToken").value;
    const from = document.getElementById("fromAccount").value;
    const to = document.getElementById("toAccount").value;
    const amount = document.getElementById("amount").value;

    if (!token || !from || !to || !amount) {
        showAlert("All fields are required", "danger");
        return;
    }

    try {
        const res = await fetch("/api/v1/transfer/", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                from_account: from,
                to_account: to,
                amount: parseFloat(amount),
                schedule_at: null
            })
        });

        const data = await res.json();

        if (!res.ok) {
            showAlert(data.detail || "Error making transfer", "danger");
            return;
        }

        showAlert(`Transfer successful! Transaction ID: ${data.transaction_id}`, "success");
    } catch (err) {
        showAlert("Network error: " + err, "danger");
    }
}

function showAlert(message, type) {
    const alertDiv = document.getElementById("alert");
    alertDiv.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
}
</script>

</body>
</html>
