<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Balance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container">
    <h2>Check Balance</h2>
    <div class="mb-3">
        <input type="text" id="jwtToken" class="form-control" placeholder="Enter JWT Access Token">
    </div>
    <button class="btn btn-primary mb-3" onclick="fetchBalance()">Check Balance</button>

    <div id="alert"></div>

    <table class="table table-bordered" id="balanceTable" style="display:none;">
        <thead>
            <tr>
                <th>Account Number</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody id="balanceBody"></tbody>
    </table>
</div>

<script>
async function fetchBalance() {
    const token = document.getElementById("jwtToken").value;
    if (!token) {
        showAlert("Please enter JWT token", "danger");
        return;
    }

    try {
        const res = await fetch("/api/v1/balance/", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        const data = await res.json();

        if (!res.ok) {
            showAlert(data.detail || "Error fetching balance", "danger");
            return;
        }

        const tbody = document.getElementById("balanceBody");
        tbody.innerHTML = "";
        data.forEach(acc => {
            const row = `<tr><td>${acc.account_number}</td><td>${acc.balance}</td></tr>`;
            tbody.innerHTML += row;
        });
        document.getElementById("balanceTable").style.display = "table";
        showAlert("Balances fetched successfully!", "success");
    } catch (err) {
        showAlert("Network error: " + err, "danger");
    }
}

function showAlert(message, type) {
    const alertDiv = document.getElementById("alert");
    alertDiv.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
}
</script>

</body>
</html>
